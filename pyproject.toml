[project]
name = "supplychain-orchestrator"
version = "0.1.0"
description = "An Explainable Agentic AI Platform for Supply Chain Risk and Recovery"
requires-python = ">=3.11"

dependencies = [
    # --- Web Framework & API ---
    "fastapi>=0.111.0",          # Backend API layer
    "uvicorn>=0.30.0",           # ASGI server to run FastAPI
    "pydantic>=2.7.0",           # Data validation (used heavily by FastAPI)

    # --- UI ---
    "streamlit>=1.35.0",         # Frontend dashboard UI

    # --- Database ---
    "psycopg2-binary>=2.9.9",    # PostgreSQL driver for Python
    "sqlalchemy>=2.0.30",        # ORM - lets us write Python instead of raw SQL
    "alembic>=1.13.1",           # Database migrations (tracks schema changes)

    # --- Graph Database ---
    "neo4j>=5.20.0",             # Neo4j Python driver

    # --- AI / LLM ---
    "langchain>=0.2.0",                  # Core LangChain framework
    "langchain-google-genai>=1.0.6",     # Gemini 2.5 Flash integration for LangChain
    "langgraph>=0.1.0",                  # Agent workflow orchestration
    "langchain-community>=0.2.0",        # Community integrations (ChromaDB etc.)

    # --- Vector Store / RAG ---
    "chromadb>=0.5.0",                   # Vector store for document embeddings
    "sentence-transformers>=3.0.0",      # Creates text embeddings (free, local)

    # --- ML / Forecasting ---
    "scikit-learn>=1.5.0",               # Machine learning models
    "pandas>=2.2.0",                     # Data manipulation
    "numpy>=1.26.0",                     # Numerical computations

    # --- Optimization ---
    "ortools>=9.10.4067",                # Google OR-Tools for recovery planning

    # --- Document parsing (upload feature) ---
    "pypdf>=4.0.0",                      # Extract text from PDF files
    "python-docx>=1.1.0",               # Extract text from DOCX files

    # --- Utilities ---
    "python-dotenv>=1.0.1",              # Reads .env file into environment variables
    "httpx>=0.27.0",                     # Async HTTP client
    "rich>=13.7.0",                      # Pretty terminal output (helpful for logging)
    "loguru>=0.7.2",                     # Better logging than Python's built-in
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",             # Testing framework
    "pytest-asyncio>=0.23.0",    # Async test support
    "ruff>=0.4.0",               # Fast linter + formatter
]

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "app", "agents", "retrieval", "graph", "tools", "evaluation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
