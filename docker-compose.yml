# Whole stack in one command:   docker compose up --build
# Needs a .env next to this file (copy .env.example): GEMINI_API_KEY, POSTGRES_PASSWORD, NEO4J_PASSWORD.
# UI: http://localhost:8501     API docs: http://localhost:8000/docs
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: supplychain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplychain"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (min 8 characters)}
    volumes:
      - neo4jdata:/data
    healthcheck:
      # "is the bolt port accepting connections?"
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/7687'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot: creates tables, seeds data (first start only), builds the document index, loads the graph.
  seed:
    build: .
    command: ["python", "scripts/docker_seed.py"]
    env_file: .env
    environment: &appenv
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - chroma:/app/chroma_db
      - hfcache:/hf-cache
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    env_file: .env
    environment: *appenv
    ports:
      - "8000:8000"
    volumes:
      - chroma:/app/chroma_db
      - hfcache:/hf-cache
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ui:
    build: .
    command: ["streamlit", "run", "app/main.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  neo4jdata:
  chroma:
  hfcache:
